<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Germ Warfare — Dive Prototype</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #050d16; height: 100%; }
      body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
      /* Canvas is 1120×760 internally; scale it down to fit small viewports
         while preserving aspect ratio. Clicks are mapped back to canvas pixels. */
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" width="1120" height="760"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
